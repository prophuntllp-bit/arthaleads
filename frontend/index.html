    <!-- Service Worker - registered here so PWABuilder / crawlers can detect it -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>

    <style>
      /* HARDCODED: Inter is the only font. Self-hosted via @fontsource-variable/inter
         (served from Vercel - no Google Fonts CDN dependency, works on all browsers).
         Applied before React loads to prevent any flash to system font.
         DO NOT remove or change this block. */
      *, *::before, *::after { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif !important; }
    </style>
  </head>
  <body>
    <!-- ── Splash screen ──────────────────────────────────────────────────────
         Shown immediately (before React loads). Pure CSS - zero JS cost.
         Faded out by main.jsx once React has painted the first frame.
    ──────────────────────────────────────────────────────────────────────── -->
    <div id="app-splash">
      <!-- Counter-rotating orbit rings + a static, glow-pulsing logo -->
      <div class="splash-orb">
        <span class="splash-ring-outer"></span>
        <span class="splash-ring-inner"></span>
        <img src="/logo.png" alt="Arthaleads" class="splash-logo" />
      </div>
      <!-- Shimmer sweep instead of pulsing dots -->
      <div class="splash-bar"><span class="splash-bar-fill"></span></div>
    </div>

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        background: #111113;
        transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #app-splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-orb {
        position: relative;
        width: 128px;
        height: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Logo stays put - only its glow breathes, nothing scales */
      .splash-logo {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        position: relative;
        z-index: 2;
        animation: splash-glow 2.4s ease-in-out infinite;
        will-change: filter;
      }
      @keyframes splash-glow {
        0%, 100% { filter: drop-shadow(0 0 14px rgba(255, 107, 0, 0.4)); }
        50%      { filter: drop-shadow(0 0 30px rgba(255, 107, 0, 0.85)); }
      }

      /* Two orbit rings spinning opposite directions at different speeds -
         an orbital-mechanics feel instead of a ring simply expanding outward. */
      .splash-ring-outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-top-color: #ff6b00;
        border-right-color: rgba(255, 107, 0, 0.35);
        animation: splash-spin 1.6s linear infinite;
        will-change: transform;
      }
      .splash-ring-inner {
        position: absolute;
        inset: 20px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #ffb37a;
        animation: splash-spin-reverse 1s linear infinite;
        will-change: transform;
      }
      @keyframes splash-spin         { to { transform: rotate(360deg);  } }
      @keyframes splash-spin-reverse { to { transform: rotate(-360deg); } }

      /* Shimmer bar - a light sweep travelling across a track, replacing
         the old grow/shrink dots with a progress-style motion instead. */
      .splash-bar {
        width: 120px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 107, 0, 0.15);
        overflow: hidden;
      }
      .splash-bar-fill {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #ff6b00, transparent);
        animation: splash-shimmer 1.3s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes splash-shimmer {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(280%);  }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-logo, .splash-ring-outer, .splash-ring-inner, .splash-bar-fill {
          animation: none;
        }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
