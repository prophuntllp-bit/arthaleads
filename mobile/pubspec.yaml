name: arthaleads_mobile
description: "Arthaleads CRM — native Android app."
publish_to: 'none'

# version: <name>+<buildNumber>. The build number is Android's versionCode, so
# it MUST increase on every release you distribute — otherwise builds are
# indistinguishable and no one is ever prompted to update.
#
# READ THIS BEFORE CHANGING THE NUMBER. It is not the build number the rest of
# the system talks about, and picking the obvious value ships an APK that
# nobody can install.
#
# Builds up to 24 were stamped with an ABI offset (versionCode = 2000 + N; see
# trueBuildNumber in lib/core/update_service.dart). The toolchain no longer
# adds it — versionCode is now exactly what is written here, confirmed with
# `aapt2 dump badging` on all four outputs of a local release build. But every
# install already in the field is on versionCode 2024, and Android refuses to
# install a lower versionCode over a higher one. A plain "+25" here therefore
# builds an APK that fails on every existing phone with a bare
# "App not installed" and no explanation.
#
# So the number stays in the 2000 band: 2000 + the real build number. The app
# recovers the real one with % 1000, which is what it reports and what
# backend/constants/appRelease.js advertises.
#
#   here: 1.0.2+2028   ->   versionCode 2028   ->   app and backend say 28
#
# After bumping, update backend/constants/appRelease.js to match (the plain
# build number, the version string, and the GitHub Release download URL).
version: 1.0.2+2028

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  intl: ^0.20.0
  url_launcher: ^6.3.1
  android_intent_plus: ^5.2.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.2
  just_audio: ^0.9.40
  pdf: ^3.11.1
  printing: ^5.13.4
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  share_plus: ^10.1.2
  file_picker: ^8.1.6
  csv: ^6.0.0
  excel: ^4.0.6
  qr: ^3.0.2
  camera: ^0.12.0+2
  font_awesome_flutter: ^11.0.0
  flutter_web_auth_2: ^5.0.3
  flutter_svg: ^2.0.10
  package_info_plus: ^8.1.1
  shared_preferences: ^2.5.5
  # SHA-256 for the signup handoff secret. Already present transitively;
  # declared because we depend on it directly now.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    # assets/icon/ is deliberately NOT bundled: those 2080x2080 source images
    # are build-time input for flutter_launcher_icons (which reads them off
    # disk), and nothing loads them at runtime. Shipping them added ~1.3MB of
    # dead weight to every APK.
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # A flat colour here is what made the launcher icon look solid orange rather
  # than the brand gradient: Android 8+ renders the ADAPTIVE icon, so the
  # gradient baked into app_icon.png only ever showed on pre-8 fallbacks.
  # This background is the same diagonal gradient, sampled from
  # frontend/public/logo.png so the app matches the web mark exactly.
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# ── Launch screen ─────────────────────────────────────────────────────────────
# Regenerate with:  dart run flutter_native_splash:create
#
# Before this, LaunchTheme set android:windowBackground twice and the second
# declaration won, so Flutter's own launch_background drawable never rendered
# and a cold start was a bare system-coloured rectangle.
#
# Two images on purpose. Below Android 12 the splash is a full drawable, so it
# takes the complete icon -- orange tile, white mark. From Android 12 the
# platform masks the splash icon into a circle, which would clip the tile's
# corners; that branch gets the white mark on an orange circle instead, which
# is the same artwork the launcher icon is built from.
#
# Both point at 512px derivatives rather than the 2080px sources. The generator
# treats the supplied file as the xxxhdpi asset and scales down from there, so
# feeding it the originals produced a 1.28MB splash.png for that bucket alone
# and 3.5MB of drawables overall -- for a mark that renders at about 128dp.
# assets/icon/ is build-time input and is not bundled, so these cost nothing
# in the APK beyond the generated drawables themselves.
flutter_native_splash:
  color: "#ffffff"
  color_dark: "#18171C"
  image: assets/icon/splash_mark.png
  android_12:
    image: assets/icon/splash_mark_fg.png
    icon_background_color: "#FF6B00"
    icon_background_color_dark: "#FF6B00"
    color: "#ffffff"
    color_dark: "#18171C"
  android: true
  ios: false
  web: false
