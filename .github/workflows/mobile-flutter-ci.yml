name: Flutter Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-flutter-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # The hosted runner's disk now fills up during the Android build ("No
      # space left on device", 17 Oct 2026), which also held back the backend
      # deploy (Railway waits for every check). Drop toolchains this job never
      # uses; the Android SDK and Java stay.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift             /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules             /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Inject google-services.json
        working-directory: mobile/android/app
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "google-services.json injected — FCM push + Google Sign-In enabled"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not set — push notifications and Google Sign-In will NOT work"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      # Only on a hand-started run: the private repo's artifact storage quota
      # ran out (19 Oct 2026), which failed every push run here and with it
      # Railway's "Wait for CI". Nobody downloads the debug APK from pushes.
      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: arthaleads-mobile-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # ── Signed release build: only when started by hand (Run workflow) ────────
      # Since the repo went private (17 Oct 2026) the runner is the small
      # private one, and the release build (R8, every ABI, then the bundle)
      # is killed partway (exit 143). It never fed a release anyway: this
      # secret is not the key installed phones carry, so public APKs are built
      # locally (see MOBILE_APP_HANDOFF.md). Analyze + debug build stay the
      # check on every push, and Railway's "Wait for CI" sees a green result.
      # Uses the standard Flutter key.properties file (read by
      # mobile/android/app/build.gradle.kts) rather than Gradle -P flags, since
      # `flutter build` doesn't reliably forward arbitrary -P properties.
      - name: Write release signing config
        id: keystore
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.keystore"
            } > android/key.properties
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "No MOBILE_KEYSTORE_BASE64 secret — skipping signed release build"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MOBILE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}

      - name: Build signed release APK + AAB
        if: steps.keystore.outputs.available == 'true'
        working-directory: mobile
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload signed release APK
        if: steps.keystore.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arthaleads-mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload release AAB (Play Store bundle)
        if: steps.keystore.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arthaleads-mobile-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
