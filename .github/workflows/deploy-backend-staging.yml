name: Deploy Backend to Railway (staging)

# Pushes to the `staging` branch deploy the backend to the Railway "staging"
# environment (api-staging.arthaleads.com), never to production.
# RAILWAY_STAGING_TOKEN is a project token created inside the staging
# environment, so it cannot reach production even if misused.
on:
  push:
    branches: [staging]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-staging.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the staging token is configured
        id: token
        run: |
          if [ -z "${{ secrets.RAILWAY_STAGING_TOKEN }}" ]; then
            echo "::warning::RAILWAY_STAGING_TOKEN is not set yet, skipping the staging deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.token.outputs.ok == 'true'
        # Same pin as production (see deploy-backend.yml).
        run: npm install --global @railway/cli@5.2.0

      - name: Deploy to Railway staging
        if: steps.token.outputs.ok == 'true'
        run: railway up --detach --service Arthaleads
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
